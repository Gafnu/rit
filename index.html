<!DOCTYPE html>
<html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>A Special Note for You</title>  
  <style>  
    body {  
      font-family: "Dancing Script", cursive, sans-serif;  
      background: linear-gradient(to right, #ff9a9e, #fad0c4);  
      color: #333;  
      text-align: center;  
      padding: 0;  
      margin: 0;  
      line-height: 1.5;  
    }

    h1 {  
      color: #ff6f61;  
      font-size: 2em;  
      margin-top: 20px;  
      margin-bottom: 20px;  
    }

    p {  
      font-size: 1.2em;  
      margin: 10px auto;  
      max-width: 90%;  
    }

    .card {  
      background: white;  
      padding: 20px;  
      border-radius: 15px;  
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);  
      margin: 20px auto;  
      width: 90%;  
      box-sizing: border-box;  
    }

    footer {  
      margin-top: 20px;  
      font-size: 0.85em;  
      padding: 10px 0;  
    }

    a {  
      color: #ff6f61;  
      text-decoration: none;  
      font-weight: bold;  
    }

    @media (min-width: 768px) {  
      h1 { font-size: 2.5em; }  
      p { font-size: 1.5em; max-width: 600px; }  
      .card { width: 600px; }  
    }
  </style>  
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">  
</head>  
<body>  
  <h1>Hello, <strong>[Ritu...]</strong>!</h1>  
  <div class="card">  
    <p>Thanks for your Chemistry notebook 🌸</p>  
    <p>Actually your writing is very similar to mine That's why I borrowed your chemistry notebook.</p>  
    <p></p>  
    <p><strong>Thank you</strong>.</p>  
    <p style="font-weight:600; color:#555;">SORRY but I am a bit introvert... I also want to borrow your Physics copy 😅</p>
    <!-- Countdown timer will appear here -->
  </div>  

  <footer>  
    <p><a href="#"><strong>[😊]</strong></a></p>  
    <p><a href="https://instagram.com/gafnu07" target="_blank">[Chat]</a></p>  
  </footer>  

  <script>
    // Anti Screenshot / Print / Save
    document.addEventListener("keydown", function(e) {
      if (
        e.key === "PrintScreen" || 
        (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u'))
      ) {
        e.preventDefault();
        alert("Screenshot/Save is disabled.");
      }
    });

    // Disable right-click
    document.addEventListener("contextmenu", e => e.preventDefault());

    const crashDuration =  0* 2 * 1000; // 2 minutes
    const crashed = localStorage.getItem("siteCrashed");

    if (crashed === "yes") {
      document.body.innerHTML = `
        <h1>⛔ Error: Site Crashed</h1>
        <p>This website is no longer available.</p>
      `;
    } else {
      // Store start time once
      if (!localStorage.getItem("siteStartTime")) {
        localStorage.setItem("siteStartTime", Date.now());
      }

      const startTime = parseInt(localStorage.getItem("siteStartTime"));
      
      // Create timer and insert at bottom of .card
      const timerText = document.createElement("p");
      timerText.style.fontWeight = "600";
      timerText.style.color = "#d1342c";
      timerText.style.marginTop = "20px";
      const card = document.querySelector(".card");
      card.appendChild(timerText);

      const updateTimer = () => {
        const now = Date.now();
        const timeLeftMs = crashDuration - (now - startTime);
        const timeLeft = Math.floor(timeLeftMs / 1000);

        if (timeLeft <= 0) {
          localStorage.setItem("siteCrashed", "yes");
          document.body.innerHTML = `
            <h1>💥 Site Crashed</h1>
            <p>This site is now unavailable.</p>
          `;
          return;
        }

        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerText.textContent = `⏳ This site will crash in ${mins}:${secs.toString().padStart(2, '0')}`;
      };

      updateTimer();
      setInterval(updateTimer, 1000);
    }
  </script>
</body>
</html>
