<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Connector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px 0;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .website-card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            margin: 20px 0;
            transition: all 0.3s ease;
        }
        .website-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #555;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Website Connector</h1>
        <p>Your gateway to our connected platforms</p>
    </header>

    <div class="container">
        <div class="website-card">
            <h2>Past</h2>
            <p>Description of the first website you want to connect to.</p>
            <a href="https://www.websiteone.com" class="btn" target="_blank">Visit Website One</a>
        </div>

        <div class="website-card">
            <h2>Present</h2>
            <p>Description of the second website you want to connect to.</p>
            <a href="https://www.websitetwo.com" class="btn" target="_blank">Visit Website Two</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2023 Website Connector. All rights reserved.</p>
    </footer>
</body>
  </div>  

  <footer>  
    <p><a href="#"><strong>[😊]</strong></a></p>  
    <p><a href="https://instagram.com/gafnu07" target="_blank">[Chat]</a></p>  
  </footer>  

  <script>
    // Anti Screenshot / Print / Save
    document.addEventListener("keydown", function(e) {
      if (
        e.key === "PrintScreen" || 
        (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u'))
      ) {
        e.preventDefault();
        alert("Screenshot/Save is disabled.");
      }
    });

    // Disable right-click
    document.addEventListener("contextmenu", e => e.preventDefault());

    const crashDuration =  0* 0 * 2; // 2 sec
    const crashed = localStorage.getItem("siteCrashed");

    if (crashed === "yes") {
      document.body.innerHTML = `
        <h1>⛔ Error: Site Crashed</h1>
        <p>This website is no longer available.</p>
      `;
    } else {
      // Store start time once
      if (!localStorage.getItem("siteStartTime")) {
        localStorage.setItem("siteStartTime", Date.now());
      }

      const startTime = parseInt(localStorage.getItem("siteStartTime"));
      
      // Create timer and insert at bottom of .card
      const timerText = document.createElement("p");
      timerText.style.fontWeight = "600";
      timerText.style.color = "#d1342c";
      timerText.style.marginTop = "20px";
      const card = document.querySelector(".card");
      card.appendChild(timerText);

      const updateTimer = () => {
        const now = Date.now();
        const timeLeftMs = crashDuration - (now - startTime);
        const timeLeft = Math.floor(timeLeftMs / 1000);

        if (timeLeft <= 0) {
          localStorage.setItem("siteCrashed", "yes");
          document.body.innerHTML = `
            <h1>💥 Site Crashed</h1>
            <p>This site is now unavailable.</p>
          `;
          return;
        }

        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerText.textContent = `⏳ This site will crash in ${mins}:${secs.toString().padStart(2, '0')}`;
      };

      updateTimer();
      setInterval(updateTimer, 1000);
    }
  </script>
</body>
</html>
